name: Desktop app

# Builds the installable FlowLabs app for Linux, macOS and Windows.
# Run it from the Actions tab, or push a v* tag to publish a release:
#   1. "release" checks the tag matches the app's version and creates the GitHub release
#      (notes from docs/releases/<tag>.md);
#   2. each build uploads its files to it, retrying when GitHub's upload times out;
#   3. "manifest" writes latest.json (versions, sizes, SHA-256), which the app reads to update itself.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the app's version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/flowlabs/__init__.py').read()).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $VERSION in src/flowlabs/__init__.py"
            exit 1
          fi
      - name: Create the release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "FlowLabs ${GITHUB_REF_NAME#v}" --notes-file "$NOTES" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "FlowLabs ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi

  build:
    name: ${{ matrix.label }}
    needs: release
    # also runs from the Actions tab, where there is no release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux-x86_64 }
          - { os: macos-14, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
          - { os: windows-latest, label: windows-x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: System webview libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 libgtk-3-dev pkg-config
      - name: Install FlowLabs and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,sql]"
      - name: Native window support
        # PyGObject 3.51+ needs girepository-2.0, which Ubuntu 22.04 does not have
        run: pip install "pywebview>=5.0" ${{ runner.os == 'Linux' && '"pygobject<3.51"' || '' }}
      - name: Check the app window can load
        run: python -c "import webview; print('pywebview', webview.__file__)"
      - name: Build the web app
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          python scripts/bundle_web.py --no-build
      - name: macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/flowlabs.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size packaging/icons/flowlabs.png --out build/flowlabs.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) packaging/icons/flowlabs.png --out build/flowlabs.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns build/flowlabs.iconset -o packaging/icons/flowlabs.icns
      - name: Build the app
        run: python scripts/build_app.py --no-web
      - name: Smoke test the built app
        run: python scripts/smoke_app.py
      - uses: actions/upload-artifact@v6
        with:
          name: flowlabs-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*setup.exe
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.deb dist/*.dmg dist/*.zip dist/*setup.exe)
          for attempt in 1 2 3 4 5; do
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber && exit 0
            echo "upload failed (attempt $attempt), retrying"; sleep $((attempt * 20))
          done
          exit 1

  pypi:
    name: Python package
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build the wheel with the web app inside
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          pip install build
          python scripts/bundle_web.py --no-build
          python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: python-package
          path: dist/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for attempt in 1 2 3 4 5; do
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber && exit 0
            echo "upload failed (attempt $attempt), retrying"; sleep $((attempt * 20))
          done
          exit 1

  manifest:
    name: Update manifest
    needs: [build, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Write latest.json from the release's files
        run: |
          mkdir assets
          for attempt in 1 2 3; do
            gh release download "$GITHUB_REF_NAME" --dir assets --clobber --pattern "FlowLabs-*" --pattern "flowlabs-*" && break
            sleep $((attempt * 20))
          done
          python3 scripts/release_manifest.py "$GITHUB_REF_NAME" assets > latest.json
          cat latest.json
          for attempt in 1 2 3 4 5; do
            gh release upload "$GITHUB_REF_NAME" latest.json --clobber && exit 0
            sleep $((attempt * 20))
          done
          exit 1
