name: Desktop app

# Builds the installable FlowLabs app for Linux, macOS and Windows.
# Run it from the Actions tab, or push a v* tag to attach the builds to a release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux-x86_64 }
          - { os: macos-14, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
          - { os: windows-latest, label: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: System webview libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 libgtk-3-dev pkg-config
      - name: Install FlowLabs and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Native window support
        continue-on-error: true # without it the app opens in the browser instead
        run: pip install "pywebview>=5.0" ${{ runner.os == 'Linux' && 'pygobject' || '' }}
      - name: Build the web app
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          python scripts/bundle_web.py --no-build
      - name: macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/flowlabs.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size packaging/icons/flowlabs.png --out build/flowlabs.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) packaging/icons/flowlabs.png --out build/flowlabs.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns build/flowlabs.iconset -o packaging/icons/flowlabs.icns
      - name: Build the app
        run: python scripts/build_app.py --no-web
      - name: Smoke test the built app
        run: python scripts/smoke_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: flowlabs-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*setup.exe
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*setup.exe

  android:
    name: android-apk
    runs-on: ubuntu-latest # has the Android SDK and a JDK preinstalled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Signing key (optional repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FLOWLABS_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        env:
          FLOWLABS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLOWLABS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          pip install pillow
          npm ci --prefix apps/web
          python scripts/build_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: flowlabs-android
          path: dist/*.apk
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  pypi:
    name: Python package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the wheel with the web app inside
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          pip install build
          python scripts/bundle_web.py --no-build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
