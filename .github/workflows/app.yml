name: Desktop app

# Builds the installable FlowLabs app for Linux, macOS and Windows.
# Run it from the Actions tab, or push a v* tag to attach the builds to a release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux-x86_64 }
          - { os: macos-14, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
          - { os: windows-latest, label: windows-x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: System webview libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 libgtk-3-dev pkg-config
      - name: Install FlowLabs and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Native window support
        # PyGObject 3.51+ needs girepository-2.0, which Ubuntu 22.04 does not have
        run: pip install "pywebview>=5.0" ${{ runner.os == 'Linux' && '"pygobject<3.51"' || '' }}
      - name: Check the app window can load
        run: python -c "import webview; print('pywebview', webview.__file__)"
      - name: Build the web app
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          python scripts/bundle_web.py --no-build
      - name: macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/flowlabs.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size packaging/icons/flowlabs.png --out build/flowlabs.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) packaging/icons/flowlabs.png --out build/flowlabs.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns build/flowlabs.iconset -o packaging/icons/flowlabs.icns
      - name: Build the app
        run: python scripts/build_app.py --no-web
      - name: Smoke test the built app
        run: python scripts/smoke_app.py
      - uses: actions/upload-artifact@v6
        with:
          name: flowlabs-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*setup.exe
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*setup.exe

  pypi:
    name: Python package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build the wheel with the web app inside
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          pip install build
          python scripts/bundle_web.py --no-build
          python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: python-package
          path: dist/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
