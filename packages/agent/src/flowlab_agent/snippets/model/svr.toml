id = "model.svr"
title = "Support vector regression"
description = "SVM for numeric targets with an epsilon-insensitive margin. Scale features first."
tags = ["svr", "svm", "support", "vector", "kernel", "regression"]
task = "regression"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.svm import SVR",
]
code = '''
model = SVR(C={{ c }}, kernel={{ kernel }}, epsilon={{ epsilon }})
model.fit(X_train, y_train)
print(f"Fitted support vector regression on {len(X_train):,} rows")
'''

[params.c]
type = "float"
default = 1.0
min = 0.001
max = 1000.0

[params.kernel]
type = "choice"
choices = ["rbf", "linear", "poly"]
default = "rbf"

[params.epsilon]
type = "float"
default = 0.1
min = 0.0
max = 100.0

[example]
dataset = "clean_numeric"
target = "y"
