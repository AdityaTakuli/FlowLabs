id = "model.hist_gradient_boosting_regressor"
title = "Histogram gradient boosting regressor"
description = "Fast gradient boosting for large tables; handles missing values natively."
tags = ["hist", "histogram", "gradient", "boosting", "lightgbm", "xgboost", "fast", "regression"]
task = "regression"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.ensemble import HistGradientBoostingRegressor",
]
code = '''
model = HistGradientBoostingRegressor(learning_rate={{ learning_rate }}, max_iter={{ max_iter }}, random_state=SEED)
model.fit(X_train, y_train)
print(f"Fitted histogram gradient boosting regressor on {len(X_train):,} rows")
'''

[params.learning_rate]
type = "float"
default = 0.1
min = 0.001
max = 1.0

[params.max_iter]
type = "int"
default = 300
min = 10
max = 10000

[example]
dataset = "clean_numeric"
target = "y"
