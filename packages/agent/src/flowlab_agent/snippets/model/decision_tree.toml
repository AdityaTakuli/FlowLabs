id = "model.decision_tree"
title = "Decision tree"
description = "A single shallow tree whose rules are printed; easy to explain to non-technical readers."
tags = ["model", "decision", "tree", "rules", "interpretable", "explain", "classification", "regression", "train"]
requires = ["split", "features_ready"]
provides = ["model"]
imports = ["from sklearn.tree import DecisionTreeClassifier, DecisionTreeRegressor, export_text"]
code = '''
tree_class = DecisionTreeClassifier if TASK == "classification" else DecisionTreeRegressor
model = tree_class(max_depth={{ max_depth }}, min_samples_leaf={{ min_samples_leaf }}, random_state=SEED)
model.fit(X_train, y_train)
print(export_text(model, feature_names=[str(c) for c in X_train.columns], max_depth=3))
'''

[params.max_depth]
type = "int"
default = 4
min = 1
max = 30

[params.min_samples_leaf]
type = "int"
default = 20
min = 1
max = 10000

[example]
target = "churned"
