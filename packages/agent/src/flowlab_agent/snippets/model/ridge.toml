id = "model.ridge"
title = "Ridge regression"
description = "Linear regression with L2 regularisation; stable when features are correlated."
tags = ["model", "ridge", "linear", "regression", "regularization", "predict", "numeric", "train"]
task = "regression"
requires = ["split", "features_ready"]
provides = ["model"]
imports = ["from sklearn.linear_model import Ridge"]
code = '''
model = Ridge(alpha={{ alpha }}).fit(X_train, y_train)
print(f"Fitted ridge regression (alpha={model.alpha}) on {len(X_train):,} rows")
'''

[params.alpha]
type = "float"
default = 1.0
min = 0.0
max = 100000.0

[example]
dataset = "clean_numeric"
target = "y"
