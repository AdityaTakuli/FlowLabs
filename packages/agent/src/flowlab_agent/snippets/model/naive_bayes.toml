id = "model.naive_bayes"
title = "Gaussian naive Bayes"
description = "Very fast probabilistic baseline assuming independent, normally distributed features."
tags = ["naive", "bayes", "gaussian", "probabilistic", "fast", "baseline", "classification"]
task = "classification"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.naive_bayes import GaussianNB",
]
code = '''
model = GaussianNB(var_smoothing={{ var_smoothing }})
model.fit(X_train, y_train)
print(f"Fitted gaussian naive bayes on {len(X_train):,} rows")
'''

[params.var_smoothing]
type = "float"
default = 1e-09
min = 1e-12
max = 1.0

[example]
target = "churned"
