id = "model.kmeans"
title = "K-means clustering"
description = "Segment rows into k clusters on scaled numeric columns; prints cluster profiles and saves assignments."
tags = ["cluster", "clustering", "kmeans", "segment", "segmentation", "group", "unsupervised"]
requires = ["df"]
stage = 1.5
imports = ["from sklearn.cluster import KMeans", "from sklearn.preprocessing import StandardScaler"]
code = '''
cluster_columns = {{ columns }} or [
    c for c in df.columns
    if pd.api.types.is_numeric_dtype(df[c]) and not pd.api.types.is_bool_dtype(df[c])
]
cluster_input = df[cluster_columns].astype(float)
cluster_input = cluster_input.fillna(cluster_input.median()).fillna(0.0)
kmeans = KMeans(n_clusters={{ n_clusters }}, n_init=10, random_state=SEED)
kmeans.fit(StandardScaler().fit_transform(cluster_input))
segments = df.assign(cluster=kmeans.labels_)
print(segments.groupby("cluster")[cluster_columns].mean().round(2).to_string())
print(segments["cluster"].value_counts().sort_index().to_string())
segments.to_csv(OUTPUT_DIR / "clusters.csv", index=False)
print(f"Saved {OUTPUT_DIR / 'clusters.csv'}")
'''

[params.n_clusters]
type = "int"
default = 4
min = 2
max = 50

[params.columns]
type = "columns"
optional = true

[example]
dataset = "clean_numeric"
with = { n_clusters = 3 }
