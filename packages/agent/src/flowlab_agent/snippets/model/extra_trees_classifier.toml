id = "model.extra_trees_classifier"
title = "Extra trees classifier"
description = "Extremely randomised trees: like a random forest, faster and often less overfit."
tags = ["extra", "trees", "extremely", "randomized", "ensemble", "forest", "classification"]
task = "classification"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.ensemble import ExtraTreesClassifier",
]
code = '''
extra_depth = {{ max_depth }}
model = ExtraTreesClassifier(n_estimators={{ n_estimators }}, max_depth=None if extra_depth == 0 else extra_depth, random_state=SEED, n_jobs=-1)
model.fit(X_train, y_train)
print(f"Fitted extra trees classifier on {len(X_train):,} rows")
'''

[params.n_estimators]
type = "int"
default = 300
min = 10
max = 5000

[params.max_depth]
type = "int"
default = 0
min = 0
max = 100
description = "0 means unlimited"

[example]
target = "churned"
