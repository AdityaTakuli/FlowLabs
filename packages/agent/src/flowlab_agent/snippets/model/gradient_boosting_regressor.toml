id = "model.gradient_boosting_regressor"
title = "Gradient boosting regressor"
description = "Histogram gradient boosting for numeric targets; strong accuracy on tabular data."
tags = ["model", "gradient", "boosting", "xgboost", "lightgbm", "ensemble", "regression", "predict", "numeric", "train"]
task = "regression"
requires = ["split", "features_ready"]
provides = ["model"]
imports = ["from sklearn.ensemble import HistGradientBoostingRegressor"]
code = '''
model = HistGradientBoostingRegressor(
    learning_rate={{ learning_rate }}, max_iter={{ max_iter }}, max_depth={{ max_depth }}, random_state=SEED
)
model.fit(X_train, y_train)
print(f"Fitted gradient boosting regressor ({model.n_iter_} iterations) on {len(X_train):,} rows")
'''

[params.learning_rate]
type = "float"
default = 0.1
min = 0.001
max = 1.0

[params.max_iter]
type = "int"
default = 200
min = 10
max = 5000

[params.max_depth]
type = "int"
optional = true
min = 1
max = 50

[example]
dataset = "clean_numeric"
target = "y"
