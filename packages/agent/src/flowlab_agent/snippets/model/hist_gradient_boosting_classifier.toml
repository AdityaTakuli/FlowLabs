id = "model.hist_gradient_boosting_classifier"
title = "Histogram gradient boosting classifier"
description = "Fast gradient boosting for large tables (LightGBM-style); handles missing values natively."
tags = ["hist", "histogram", "gradient", "boosting", "lightgbm", "xgboost", "fast", "large", "classification"]
task = "classification"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.ensemble import HistGradientBoostingClassifier",
]
code = '''
hgb_depth = {{ max_depth }}
model = HistGradientBoostingClassifier(learning_rate={{ learning_rate }}, max_iter={{ max_iter }}, max_depth=None if hgb_depth == 0 else hgb_depth, random_state=SEED)
model.fit(X_train, y_train)
print(f"Fitted histogram gradient boosting classifier on {len(X_train):,} rows")
'''

[params.learning_rate]
type = "float"
default = 0.1
min = 0.001
max = 1.0

[params.max_iter]
type = "int"
default = 300
min = 10
max = 10000

[params.max_depth]
type = "int"
default = 0
min = 0
max = 50
description = "0 means unlimited"

[example]
target = "churned"
