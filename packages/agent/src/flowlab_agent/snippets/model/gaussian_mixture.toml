id = "model.gaussian_mixture"
title = "Gaussian mixture clustering"
description = "Soft clusters from a mixture of Gaussians; handles elliptical cluster shapes."
tags = ["gaussian", "mixture", "gmm", "em", "cluster", "clustering", "soft", "unsupervised"]
requires = ["df"]
stage = 1.5
imports = [
    "from sklearn.mixture import GaussianMixture",
    "from sklearn.preprocessing import StandardScaler",
]
code = '''
cluster_columns = {{ columns }} or [
    c for c in df.columns
    if pd.api.types.is_numeric_dtype(df[c]) and not pd.api.types.is_bool_dtype(df[c])
]
cluster_input = df[cluster_columns].astype(float)
cluster_input = StandardScaler().fit_transform(cluster_input.fillna(cluster_input.median()).fillna(0.0))
clusterer = GaussianMixture(n_components={{ n_components }}, covariance_type={{ covariance }}, random_state=SEED).fit(cluster_input)
segments = df.assign(cluster=clusterer.predict(cluster_input))
print(segments["cluster"].value_counts().sort_index().to_string())
print(segments.groupby("cluster")[cluster_columns].mean().round(2).to_string())
'''

[params.n_components]
type = "int"
default = 4
min = 2
max = 50

[params.covariance]
type = "choice"
choices = ["full", "diag", "tied", "spherical"]
default = "full"

[params.columns]
type = "columns"
optional = true

[example]
dataset = "clean_numeric"
