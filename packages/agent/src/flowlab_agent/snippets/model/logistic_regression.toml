id = "model.logistic_regression"
title = "Logistic regression"
description = "Linear classifier with interpretable coefficients. A strong, explainable baseline."
tags = ["model", "logistic", "regression", "linear", "classification", "classify", "baseline", "interpretable", "train"]
task = "classification"
requires = ["split", "features_ready"]
provides = ["model"]
imports = ["from sklearn.linear_model import LogisticRegression"]
code = '''
model = LogisticRegression(
    C={{ c }},
    class_weight=None if {{ class_weight }} == "none" else "balanced",
    max_iter={{ max_iter }},
)
model.fit(X_train, y_train)
print(f"Fitted logistic regression on {len(X_train):,} rows")
'''

[params.c]
type = "float"
default = 1.0
min = 0.0001
max = 10000.0
description = "Inverse regularisation strength"

[params.class_weight]
type = "choice"
choices = ["none", "balanced"]
default = "none"

[params.max_iter]
type = "int"
default = 2000
min = 100
max = 100000

[example]
target = "churned"
with = { class_weight = "balanced" }
