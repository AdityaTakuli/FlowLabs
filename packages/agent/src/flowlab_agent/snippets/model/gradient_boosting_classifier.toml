id = "model.gradient_boosting_classifier"
title = "Gradient boosting classifier"
description = "Histogram gradient boosting; often the most accurate choice on tabular classification."
tags = ["model", "gradient", "boosting", "xgboost", "lightgbm", "ensemble", "classification", "classify", "accurate", "train"]
task = "classification"
requires = ["split", "features_ready"]
provides = ["model"]
imports = ["from sklearn.ensemble import HistGradientBoostingClassifier"]
code = '''
model = HistGradientBoostingClassifier(
    learning_rate={{ learning_rate }},
    max_iter={{ max_iter }},
    max_depth={{ max_depth }},
    class_weight=None if {{ class_weight }} == "none" else "balanced",
    random_state=SEED,
)
model.fit(X_train, y_train)
print(f"Fitted gradient boosting ({model.n_iter_} iterations) on {len(X_train):,} rows")
'''

[params.learning_rate]
type = "float"
default = 0.1
min = 0.001
max = 1.0

[params.max_iter]
type = "int"
default = 200
min = 10
max = 5000

[params.max_depth]
type = "int"
optional = true
min = 1
max = 50

[params.class_weight]
type = "choice"
choices = ["none", "balanced"]
default = "none"

[example]
target = "churned"
