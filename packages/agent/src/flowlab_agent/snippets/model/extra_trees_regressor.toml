id = "model.extra_trees_regressor"
title = "Extra trees regressor"
description = "Extremely randomised trees for numeric targets."
tags = ["extra", "trees", "ensemble", "forest", "regression"]
task = "regression"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.ensemble import ExtraTreesRegressor",
]
code = '''
model = ExtraTreesRegressor(n_estimators={{ n_estimators }}, random_state=SEED, n_jobs=-1)
model.fit(X_train, y_train)
print(f"Fitted extra trees regressor on {len(X_train):,} rows")
'''

[params.n_estimators]
type = "int"
default = 300
min = 10
max = 5000

[example]
dataset = "clean_numeric"
target = "y"
