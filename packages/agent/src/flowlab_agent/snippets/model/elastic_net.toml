id = "model.elastic_net"
title = "Elastic net regression"
description = "Linear regression mixing L1 and L2 regularisation."
tags = ["elastic", "net", "l1", "l2", "linear", "regularization", "regression"]
task = "regression"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.linear_model import ElasticNet",
]
code = '''
model = ElasticNet(alpha={{ alpha }}, l1_ratio={{ l1_ratio }}, max_iter=10000)
model.fit(X_train, y_train)
print(f"Fitted elastic net regression on {len(X_train):,} rows")
'''

[params.alpha]
type = "float"
default = 0.01
min = 1e-06
max = 1000.0

[params.l1_ratio]
type = "float"
default = 0.5
min = 0.0
max = 1.0

[example]
dataset = "clean_numeric"
target = "y"
