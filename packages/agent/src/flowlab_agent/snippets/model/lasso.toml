id = "model.lasso"
title = "Lasso regression"
description = "Linear regression with L1 regularisation; drives unhelpful coefficients to zero."
tags = ["lasso", "l1", "linear", "regularization", "sparse", "regression"]
task = "regression"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.linear_model import Lasso",
]
code = '''
model = Lasso(alpha={{ alpha }}, max_iter=10000)
model.fit(X_train, y_train)
print(f"Fitted lasso regression on {len(X_train):,} rows")
'''

[params.alpha]
type = "float"
default = 0.01
min = 1e-06
max = 1000.0

[example]
dataset = "clean_numeric"
target = "y"
