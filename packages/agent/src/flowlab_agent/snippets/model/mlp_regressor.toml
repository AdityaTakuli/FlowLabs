id = "model.mlp_regressor"
title = "Neural network regressor (sklearn MLP)"
description = "Multi-layer perceptron for numeric targets. Hidden layers like '64,32'. Scale features first."
tags = ["mlp", "neural", "network", "perceptron", "deep", "regression"]
task = "regression"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.neural_network import MLPRegressor",
]
code = '''
mlp_hidden = {{ hidden_layers }}
model = MLPRegressor(hidden_layer_sizes=tuple(int(p) for p in mlp_hidden.split(",") if p.strip()), alpha={{ alpha }}, max_iter={{ max_iter }}, early_stopping=True, random_state=SEED)
model.fit(X_train, y_train)
print(f"Fitted neural network regressor (sklearn mlp) on {len(X_train):,} rows")
'''

[params.hidden_layers]
type = "text"
default = "64,32"

[params.alpha]
type = "float"
default = 0.0001
min = 0.0
max = 10.0

[params.max_iter]
type = "int"
default = 500
min = 10
max = 10000

[example]
dataset = "clean_numeric"
target = "y"
