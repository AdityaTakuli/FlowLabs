id = "model.lda_classifier"
title = "Linear discriminant analysis"
description = "Linear classifier assuming shared class covariance; fast, stable and interpretable."
tags = ["lda", "linear", "discriminant", "analysis", "classification"]
task = "classification"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.discriminant_analysis import LinearDiscriminantAnalysis",
]
code = '''
model = LinearDiscriminantAnalysis(solver={{ solver }})
model.fit(X_train, y_train)
print(f"Fitted linear discriminant analysis on {len(X_train):,} rows")
'''

[params.solver]
type = "choice"
choices = ["svd", "lsqr"]
default = "svd"

[example]
target = "churned"
