id = "model.svm_classifier"
title = "Support vector machine"
description = "SVM classifier with RBF, linear or polynomial kernel. Scale features first."
tags = ["svm", "svc", "support", "vector", "kernel", "classification", "classify"]
task = "classification"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.svm import SVC",
]
code = '''
model = SVC(C={{ c }}, kernel={{ kernel }}, probability=True, random_state=SEED)
model.fit(X_train, y_train)
print(f"Fitted support vector machine on {len(X_train):,} rows")
'''

[params.c]
type = "float"
default = 1.0
min = 0.001
max = 1000.0

[params.kernel]
type = "choice"
choices = ["rbf", "linear", "poly", "sigmoid"]
default = "rbf"

[example]
target = "churned"
