id = "model.knn_regressor"
title = "K-nearest neighbours regressor"
description = "Averages the target of the k most similar training rows. Scale features first."
tags = ["knn", "neighbours", "neighbors", "nearest", "regression"]
task = "regression"
requires = ["split", "features_ready"]
provides = ["model"]
imports = [
    "from sklearn.neighbors import KNeighborsRegressor",
]
code = '''
model = KNeighborsRegressor(n_neighbors={{ n_neighbors }}, weights={{ weights }})
model.fit(X_train, y_train)
print(f"Fitted k-nearest neighbours regressor on {len(X_train):,} rows")
'''

[params.n_neighbors]
type = "int"
default = 15
min = 1
max = 500

[params.weights]
type = "choice"
choices = ["uniform", "distance"]
default = "distance"

[example]
dataset = "clean_numeric"
target = "y"
