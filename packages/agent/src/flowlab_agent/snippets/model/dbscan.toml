id = "model.dbscan"
title = "DBSCAN clustering"
description = "Density-based clusters of any shape; rows in sparse regions are labelled -1 (noise)."
tags = ["dbscan", "density", "cluster", "clustering", "noise", "outliers", "unsupervised"]
requires = ["df"]
stage = 1.5
imports = [
    "from sklearn.cluster import DBSCAN",
    "from sklearn.preprocessing import StandardScaler",
]
code = '''
cluster_columns = {{ columns }} or [
    c for c in df.columns
    if pd.api.types.is_numeric_dtype(df[c]) and not pd.api.types.is_bool_dtype(df[c])
]
cluster_input = df[cluster_columns].astype(float)
cluster_input = StandardScaler().fit_transform(cluster_input.fillna(cluster_input.median()).fillna(0.0))
clusterer = DBSCAN(eps={{ eps }}, min_samples={{ min_samples }}).fit(cluster_input)
segments = df.assign(cluster=clusterer.labels_)
print(segments["cluster"].value_counts().sort_index().to_string())
print(segments.groupby("cluster")[cluster_columns].mean().round(2).to_string())
'''

[params.eps]
type = "float"
default = 1.5
min = 0.01
max = 100.0

[params.min_samples]
type = "int"
default = 5
min = 1
max = 1000

[params.columns]
type = "columns"
optional = true

[example]
dataset = "clean_numeric"
