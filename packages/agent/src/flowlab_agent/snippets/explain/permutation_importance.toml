id = "explain.permutation_importance"
title = "Permutation importance"
description = "How much the test score drops when each feature is shuffled; works for any model."
tags = ["importance", "permutation", "drivers", "explain", "why", "important", "model", "agnostic"]
requires = ["model", "split", "features_ready"]
imports = ["from sklearn.inspection import permutation_importance"]
code = '''
permutation = permutation_importance(model, X_test, y_test, n_repeats={{ repeats }}, random_state=SEED, n_jobs=-1)
permutation_table = pd.DataFrame(
    {"mean_drop": permutation.importances_mean, "std": permutation.importances_std}, index=X_test.columns
).sort_values("mean_drop", ascending=False)
print(permutation_table.head({{ top }}).round(4).to_string())
'''

[params.repeats]
type = "int"
default = 5
min = 1
max = 100

[params.top]
type = "int"
default = 15
min = 1
max = 200

[example]
target = "churned"
with = { repeats = 3 }
