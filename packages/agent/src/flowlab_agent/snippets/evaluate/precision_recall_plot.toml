id = "evaluate.precision_recall_plot"
title = "Precision-recall curve"
description = "Precision against recall on test for a binary classifier, with average precision; better than ROC for rare classes."
tags = ["precision", "recall", "curve", "average", "imbalanced", "evaluate", "classification", "chart"]
task = "classification"
requires = ["model", "split", "features_ready"]
imports = [
    "import matplotlib.pyplot as plt",
    "from sklearn.metrics import average_precision_score, precision_recall_curve",
]
code = '''
positive_label = model.classes_[-1]
scores = model.predict_proba(X_test)[:, -1]
precision, recall, _ = precision_recall_curve(y_test == positive_label, scores)
average_precision = average_precision_score(y_test == positive_label, scores)
fig, ax = plt.subplots(figsize=(6, 4.5))
ax.plot(recall, precision, color="black")
ax.set(title=f"Precision-recall (AP {average_precision:.3f})", xlabel="recall", ylabel="precision")
chart_path = OUTPUT_DIR / "precision_recall.png"
fig.tight_layout()
fig.savefig(chart_path, dpi=120)
plt.close(fig)
print(f"Average precision {average_precision:.3f}; saved {chart_path}")
'''

[example]
target = "churned"
