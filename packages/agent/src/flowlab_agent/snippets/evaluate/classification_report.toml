id = "evaluate.classification_report"
title = "Classification metrics"
description = "Precision, recall, F1, accuracy against the majority baseline, balanced accuracy and ROC AUC on test."
tags = ["evaluate", "metrics", "accuracy", "precision", "recall", "f1", "auc", "report", "classification", "performance"]
task = "classification"
requires = ["model", "split", "features_ready"]
provides = ["preds"]
imports = ["from sklearn.metrics import accuracy_score, balanced_accuracy_score, classification_report, roc_auc_score"]
code = '''
y_pred = model.predict(X_test)
print(classification_report(y_test, y_pred, zero_division=0))
accuracy = accuracy_score(y_test, y_pred)
majority_baseline = y_test.value_counts(normalize=True).max()
print(f"Accuracy {accuracy:.3f} vs majority-class baseline {majority_baseline:.3f}")
print(f"Balanced accuracy {balanced_accuracy_score(y_test, y_pred):.3f}")
if hasattr(model, "predict_proba") and y_test.nunique() == 2:
    positive_class = model.classes_[-1]
    print(f"ROC AUC ('{positive_class}' as positive class): {roc_auc_score(y_test == positive_class, model.predict_proba(X_test)[:, -1]):.3f}")
if accuracy < majority_baseline + 0.02:
    print("Warning: accuracy is not clearly above always predicting the most common class; judge by balanced accuracy and recall.")
'''

[example]
target = "churned"
