id = "evaluate.residual_plot"
title = "Residual chart"
description = "Save predicted-versus-residual and predicted-versus-actual plots for a regression model."
tags = ["residual", "error", "chart", "plot", "evaluate", "regression", "diagnostics"]
task = "regression"
requires = ["model", "split", "features_ready"]
imports = ["import matplotlib.pyplot as plt"]
code = '''
predicted = model.predict(X_test)
residuals = y_test.to_numpy(dtype=float) - predicted
fig, (left, right) = plt.subplots(1, 2, figsize=(10, 4))
left.scatter(predicted, residuals, s=10, alpha=0.5)
left.axhline(0, color="black", linewidth=1)
left.set(title="Residuals vs predicted", xlabel="predicted", ylabel="actual - predicted")
right.scatter(y_test, predicted, s=10, alpha=0.5)
limits = [min(y_test.min(), predicted.min()), max(y_test.max(), predicted.max())]
right.plot(limits, limits, color="black", linewidth=1)
right.set(title="Predicted vs actual", xlabel="actual", ylabel="predicted")
chart_path = OUTPUT_DIR / {{ filename }}
fig.tight_layout()
fig.savefig(chart_path, dpi=120)
plt.close(fig)
print(f"Saved {chart_path}")
'''

[params.filename]
type = "path"
default = "residuals.png"

[example]
dataset = "clean_numeric"
target = "y"
