id = "evaluate.regression_metrics"
title = "Regression metrics"
description = "R-squared, MAE and RMSE on test, compared with always predicting the train mean."
tags = ["evaluate", "metrics", "r2", "mae", "rmse", "error", "regression", "performance"]
task = "regression"
requires = ["model", "split", "features_ready"]
provides = ["preds"]
imports = ["from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score"]
code = '''
y_pred = model.predict(X_test)
mean_baseline = np.full(len(y_test), y_train.mean())
print(f"R-squared: {r2_score(y_test, y_pred):.4f}")
print(f"MAE: {mean_absolute_error(y_test, y_pred):.4f} (predicting the mean: {mean_absolute_error(y_test, mean_baseline):.4f})")
print(f"RMSE: {np.sqrt(mean_squared_error(y_test, y_pred)):.4f}")
'''

[example]
dataset = "clean_numeric"
target = "y"
