id = "evaluate.roc_curve_plot"
title = "ROC curve chart"
description = "Save the ROC curve for a binary classifier as a PNG."
tags = ["roc", "auc", "curve", "chart", "plot", "evaluate", "classification", "threshold"]
task = "classification"
requires = ["model", "split", "features_ready"]
imports = ["import matplotlib.pyplot as plt", "from sklearn.metrics import RocCurveDisplay"]
code = '''
if y_test.nunique() != 2 or not hasattr(model, "predict_proba"):
    print("ROC curve needs a binary target and a model with predict_proba; skipped.")
else:
    fig, ax = plt.subplots(figsize=(5, 4))
    RocCurveDisplay.from_estimator(model, X_test, y_test, ax=ax)
    ax.plot([0, 1], [0, 1], linestyle="--", color="grey")
    ax.set_title("ROC curve (test)")
    chart_path = OUTPUT_DIR / {{ filename }}
    fig.tight_layout()
    fig.savefig(chart_path, dpi=120)
    plt.close(fig)
    print(f"Saved {chart_path}")
'''

[params.filename]
type = "path"
default = "roc_curve.png"

[example]
target = "churned"
