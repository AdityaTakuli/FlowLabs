id = "viz.line_trend"
title = "Trend over time"
description = "Line chart of a numeric column over a date column, optionally resampled by day/week/month/quarter."
tags = ["line", "trend", "time", "series", "over", "date", "chart", "plot", "viz", "forecast", "seasonality"]
requires = ["df"]
imports = ["import matplotlib.pyplot as plt"]
code = '''
x_column, y_column = {{ x }}, {{ y }}
trend = df[[x_column, y_column]].copy()
if not (pd.api.types.is_datetime64_any_dtype(trend[x_column]) or pd.api.types.is_numeric_dtype(trend[x_column])):
    trend[x_column] = pd.to_datetime(trend[x_column], errors="coerce", format="mixed")
trend[y_column] = pd.to_numeric(trend[y_column], errors="coerce")
trend = trend.dropna().sort_values(x_column)
frequency = {"none": None, "day": "D", "week": "W", "month": "ME", "quarter": "QE"}[{{ frequency }}]
series = trend.set_index(x_column)[y_column]
series = series.resample(frequency).agg({{ agg }}) if frequency else series.groupby(level=0).agg({{ agg }})
fig, ax = plt.subplots(figsize=(9, 4))
ax.plot(series.index, series.to_numpy(), linewidth=1.5)
ax.set(title=f"{y_column} over {x_column}", xlabel=x_column, ylabel=y_column)
chart_path = OUTPUT_DIR / ({{ filename }} or f"trend_{y_column}.png")
fig.autofmt_xdate()
fig.tight_layout()
fig.savefig(chart_path, dpi=120)
plt.close(fig)
print(f"Saved {chart_path} ({len(series):,} points)")
'''

[params.x]
type = "column"
description = "Date or time column"

[params.y]
type = "column"

[params.frequency]
type = "choice"
choices = ["none", "day", "week", "month", "quarter"]
default = "none"

[params.agg]
type = "choice"
choices = ["mean", "sum", "median", "max", "min"]
default = "mean"

[params.filename]
type = "path"
optional = true

[example]
dataset = "timeseries"
with = { x = "date", y = "sales", frequency = "week" }
