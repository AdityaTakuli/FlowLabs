id = "viz.missing_bar"
title = "Missing values chart"
description = "Bar chart of the share of missing values per column; saved as PNG."
tags = ["missing", "null", "nan", "quality", "chart", "plot", "viz", "eda"]
requires = ["df"]
imports = ["import matplotlib.pyplot as plt"]
code = '''
missing_share = df.isna().mean().mul(100).sort_values()
missing_share = missing_share[missing_share > 0]
fig, ax = plt.subplots(figsize=(7, 0.35 * max(len(missing_share), 1) + 1))
if missing_share.empty:
    ax.text(0.5, 0.5, "No missing values", ha="center", va="center")
    ax.set_axis_off()
else:
    missing_share.plot.barh(ax=ax, color="#C44E52")
    ax.set(title="Missing values by column", xlabel="% of rows")
chart_path = OUTPUT_DIR / {{ filename }}
fig.tight_layout()
fig.savefig(chart_path, dpi=120)
plt.close(fig)
print(f"Saved {chart_path}")
'''

[params.filename]
type = "path"
default = "missing_values.png"
