id = "inspect.value_counts"
title = "Value counts of a column"
description = "Most frequent values of one column with counts and percentages."
tags = ["value", "counts", "frequency", "categorical", "distribution", "top"]
requires = ["df"]
code = '''
counts = df[{{ column }}].value_counts(dropna=False).head({{ top }})
print(pd.DataFrame({"count": counts, "percent": (counts / len(df) * 100).round(2)}).to_string())
'''

[params.column]
type = "column"

[params.top]
type = "int"
default = 10
min = 1
max = 100

[example]
with = { column = "plan_type" }
