id = "inspect.correlations"
title = "Strongest correlations"
description = "Rank numeric correlations, either with a target column or between all pairs."
tags = ["correlation", "relationship", "related", "drivers", "pairs", "eda"]
requires = ["df"]
code = '''
numeric = df.select_dtypes(include=["number", "bool"]).astype(float)
corr = numeric.corr(method={{ method }})
corr_target = {{ target }}
if corr_target is not None and corr_target in corr.columns:
    ranked = corr[corr_target].drop(corr_target).dropna()
    print(f"Correlation with {corr_target}:")
else:
    ranked = corr.where(np.triu(np.ones(corr.shape, dtype=bool), k=1)).stack()
    print("Strongest correlated pairs:")
ranked = ranked.reindex(ranked.abs().sort_values(ascending=False).index).head({{ top }})
print(ranked.round(3).to_string())
'''

[params.method]
type = "choice"
choices = ["pearson", "spearman", "kendall"]
default = "spearman"

[params.target]
type = "column"
optional = true
description = "Rank correlations with this column"

[params.top]
type = "int"
default = 10
min = 1
max = 100

[example]
with = { target = "churned" }
