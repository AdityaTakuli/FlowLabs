id = "inspect.groupby_summary"
title = "Summary by group"
description = "Aggregate numeric columns per group, e.g. average spend by plan."
tags = ["group", "groupby", "aggregate", "average", "by", "segment", "pivot", "compare"]
requires = ["df"]
code = '''
group_column = {{ group_column }}
value_columns = {{ columns }} or [
    c for c in df.columns
    if c != group_column and pd.api.types.is_numeric_dtype(df[c]) and not pd.api.types.is_bool_dtype(df[c])
]
summary = df.groupby(group_column, dropna=False)[value_columns].agg({{ agg }})
summary.insert(0, "rows", df.groupby(group_column, dropna=False).size())
print(summary.round(3).to_string())
'''

[params.group_column]
type = "column"

[params.columns]
type = "columns"
optional = true
description = "Numeric columns to aggregate (all if omitted)"

[params.agg]
type = "choice"
choices = ["mean", "median", "sum", "min", "max"]
default = "mean"

[example]
with = { group_column = "plan_type", columns = ["monthly_charges", "tenure_months"] }
