id = "inspect.overview"
title = "Dataset overview"
description = "Print shape, column types and the first rows."
tags = ["overview", "shape", "dtypes", "head", "summary", "explore", "eda", "look"]
requires = ["df"]
code = '''
print(f"Shape: {df.shape[0]:,} rows x {df.shape[1]} columns")
print(df.dtypes.astype(str).to_string())
print(df.head({{ rows }}).to_string())
'''

[params.rows]
type = "int"
default = 5
min = 1
max = 50
description = "Rows to show"
