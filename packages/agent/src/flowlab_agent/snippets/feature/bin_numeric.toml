id = "feature.bin_numeric"
title = "Bin a numeric column"
description = "Group a numeric column into equal-width or equal-count bands as a new category column."
tags = ["bin", "bucket", "band", "group", "cut", "quantile", "feature", "derive"]
requires = ["df"]
provides = ["df"]
code = '''
bin_source = pd.to_numeric(df[{{ column }}], errors="coerce")
if {{ method }} == "quantile":
    bands = pd.qcut(bin_source, q={{ bins }}, duplicates="drop")
else:
    bands = pd.cut(bin_source, bins={{ bins }})
df[{{ name }}] = bands.astype("string")
print(df[{{ name }}].value_counts(dropna=False).sort_index().to_string())
'''

[params.column]
type = "column"

[params.bins]
type = "int"
default = 5
min = 2
max = 50

[params.method]
type = "choice"
choices = ["equal_width", "quantile"]
default = "quantile"

[params.name]
type = "new_column"

[example]
with = { column = "tenure_months", bins = 4, name = "tenure_band" }
