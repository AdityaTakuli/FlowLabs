id = "feature.log_transform"
title = "Log-transform skewed columns"
description = "Add log1p versions of right-skewed, non-negative numeric columns."
tags = ["log", "skew", "transform", "feature", "derive", "normalize"]
requires = ["df"]
provides = ["df"]
code = '''
for log_column in {{ columns }}:
    values = pd.to_numeric(df[log_column], errors="coerce")
    df[f"log_{log_column}"] = np.log1p(values.clip(lower=0))
print("Added log columns for", {{ columns }})
'''

[params.columns]
type = "columns"

[example]
with = { columns = ["monthly_charges"] }
