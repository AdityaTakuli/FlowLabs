id = "split.train_test"
title = "Train/test split"
description = "Hold out a random test set (stratified for classification). Everything that learns must come after this."
tags = ["split", "train", "test", "holdout", "stratify", "model", "predict", "classification", "regression"]
requires = ["df"]
provides = ["split"]
imports = ["from sklearn.model_selection import train_test_split"]
code = '''
TARGET = {{ target }}
data = df.dropna(subset=[TARGET])
X = data.drop(columns=[TARGET])
y = data[TARGET]
is_label = not pd.api.types.is_numeric_dtype(y) or pd.api.types.is_bool_dtype(y) or y.nunique() <= 10
TASK = "classification" if is_label else "regression"
stratify = y if TASK == "classification" and {{ stratify }} and y.value_counts().min() >= 2 else None
X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size={{ test_size }}, random_state=SEED, stratify=stratify
)
print(f"{TASK} on {TARGET}: {len(X_train):,} train rows, {len(X_test):,} test rows")
'''

[params.target]
type = "column"
description = "Column to predict"

[params.test_size]
type = "float"
default = 0.2
min = 0.05
max = 0.5

[params.stratify]
type = "bool"
default = true

[example]
target = "churned"
