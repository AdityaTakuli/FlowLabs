id = "split.time_based"
title = "Time-based train/test split"
description = "Train on earlier rows and test on the most recent ones. Use whenever rows are ordered in time."
tags = ["split", "time", "date", "temporal", "forecast", "chronological", "train", "test"]
requires = ["df"]
provides = ["split"]
code = '''
TARGET = {{ target }}
time_column = {{ time_column }}
data = df.dropna(subset=[TARGET])
order_key = data[time_column]
if not (pd.api.types.is_datetime64_any_dtype(order_key) or pd.api.types.is_numeric_dtype(order_key)):
    order_key = pd.to_datetime(order_key, errors="coerce", format="mixed")
data = data.loc[order_key.sort_values(kind="stable").index]
cutoff = int(len(data) * (1 - {{ test_size }}))
X = data.drop(columns=[TARGET])
y = data[TARGET]
is_label = not pd.api.types.is_numeric_dtype(y) or pd.api.types.is_bool_dtype(y) or y.nunique() <= 10
TASK = "classification" if is_label else "regression"
X_train, X_test = X.iloc[:cutoff], X.iloc[cutoff:]
y_train, y_test = y.iloc[:cutoff], y.iloc[cutoff:]
print(f"{TASK} on {TARGET}: train up to row {cutoff:,} by {time_column}, {len(X_test):,} most recent rows for test")
'''

[params.target]
type = "column"

[params.time_column]
type = "column"

[params.test_size]
type = "float"
default = 0.2
min = 0.05
max = 0.5

[example]
dataset = "timeseries"
target = "sales"
with = { time_column = "date" }
