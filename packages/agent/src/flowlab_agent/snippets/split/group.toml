id = "split.group"
title = "Group-aware train/test split"
description = "Keep every row of a group (customer, patient, store) on one side of the split."
tags = ["split", "group", "entity", "leakage", "customer", "train", "test"]
requires = ["df"]
provides = ["split"]
imports = ["from sklearn.model_selection import GroupShuffleSplit"]
code = '''
TARGET = {{ target }}
group_column = {{ group_column }}
data = df.dropna(subset=[TARGET])
X = data.drop(columns=[TARGET])
y = data[TARGET]
is_label = not pd.api.types.is_numeric_dtype(y) or pd.api.types.is_bool_dtype(y) or y.nunique() <= 10
TASK = "classification" if is_label else "regression"
groups = data[group_column].astype("string").fillna("missing")
splitter = GroupShuffleSplit(n_splits=1, test_size={{ test_size }}, random_state=SEED)
train_index, test_index = next(splitter.split(X, y, groups=groups))
X_train, X_test = X.iloc[train_index], X.iloc[test_index]
y_train, y_test = y.iloc[train_index], y.iloc[test_index]
print(f"{TASK} on {TARGET}: {len(X_train):,} train rows, {len(X_test):,} test rows, grouped by {group_column}")
'''

[params.target]
type = "column"

[params.group_column]
type = "column"

[params.test_size]
type = "float"
default = 0.2
min = 0.05
max = 0.5

[example]
target = "churned"
with = { group_column = "contract", test_size = 0.34 }
