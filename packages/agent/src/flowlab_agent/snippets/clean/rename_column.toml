id = "clean.rename_column"
title = "Rename a column"
description = "Give a column a new name."
tags = ["rename", "name", "column", "label"]
requires = ["df"]
provides = ["df"]
code = '''
old_name, new_name = {{ column }}, {{ name }}
df = df.rename(columns={old_name: new_name})
print(f"Renamed {old_name} -> {new_name}")
'''

[params.column]
type = "column"

[params.name]
type = "new_column"

[example]
with = { column = "support_calls", name = "calls" }
