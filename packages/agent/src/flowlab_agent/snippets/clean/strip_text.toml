id = "clean.strip_text"
title = "Normalise text columns"
description = "Trim whitespace, collapse repeated spaces, optionally lowercase; empty strings become missing."
tags = ["text", "strip", "whitespace", "lowercase", "normalize", "messy", "clean", "tidy"]
requires = ["df"]
provides = ["df"]
code = '''
text_columns = {{ columns }} or [
    c for c in df.columns
    if not (
        pd.api.types.is_numeric_dtype(df[c])
        or pd.api.types.is_bool_dtype(df[c])
        or pd.api.types.is_datetime64_any_dtype(df[c])
    )
]
for text_column in text_columns:
    cleaned = df[text_column].astype("string").str.strip().str.replace(r"\s+", " ", regex=True)
    if {{ lowercase }}:
        cleaned = cleaned.str.lower()
    df[text_column] = cleaned.replace("", pd.NA)
print(f"Normalised {len(text_columns)} text columns")
'''

[params.columns]
type = "columns"
optional = true
description = "Text columns (all text columns if omitted)"

[params.lowercase]
type = "bool"
default = false

[example]
dataset = "mixed_messy"
with = { columns = ["city", "channel"], lowercase = true }
