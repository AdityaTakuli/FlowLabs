id = "clean.fill_constant"
title = "Fill missing with a constant"
description = "Replace missing values with a fixed value such as 0 or 'unknown'. Learns nothing from data."
tags = ["missing", "fill", "fillna", "constant", "null", "replace", "clean"]
requires = ["df"]
provides = ["df"]
code = '''
fill_value = {{ value }}
for fill_column in {{ columns }}:
    df[fill_column] = df[fill_column].fillna(fill_value)
print(f"Filled missing values with {fill_value!r} in", {{ columns }})
'''

[params.columns]
type = "columns"

[params.value]
type = "scalar"

[example]
with = { columns = ["tenure_months"], value = 0 }
