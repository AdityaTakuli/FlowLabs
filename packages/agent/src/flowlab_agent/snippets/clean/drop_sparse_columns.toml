id = "clean.drop_sparse_columns"
title = "Drop mostly-empty columns"
description = "Remove columns whose share of missing values exceeds a threshold."
tags = ["missing", "sparse", "empty", "drop", "columns", "clean"]
requires = ["df"]
provides = ["df"]
code = '''
max_missing_share = {{ threshold }}
missing_share = df.isna().mean()
sparse_columns = missing_share[missing_share > max_missing_share].index.tolist()
df = df.drop(columns=sparse_columns)
print(f"Dropped columns missing in more than {max_missing_share:.0%} of rows: {sparse_columns}")
'''

[params.threshold]
type = "float"
default = 0.5
min = 0.0
max = 1.0
