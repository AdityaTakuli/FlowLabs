id = "clean.replace_values"
title = "Replace a value in a column"
description = "Swap one value for another, e.g. fix a misspelt category."
tags = ["replace", "recode", "map", "fix", "value", "category", "clean"]
requires = ["df"]
provides = ["df"]
code = '''
replace_column, old_value, new_value = {{ column }}, {{ old }}, {{ new }}
replaced_rows = int((df[replace_column] == old_value).sum())
df[replace_column] = df[replace_column].replace(old_value, new_value)
print(f"Replaced {old_value!r} with {new_value!r} in {replaced_rows} rows of {replace_column}")
'''

[params.column]
type = "column"

[params.old]
type = "scalar"

[params.new]
type = "scalar"

[example]
with = { column = "contract", old = "month_to_month", new = "monthly" }
