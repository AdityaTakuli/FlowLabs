id = "load.excel"
title = "Load an Excel sheet"
description = "Read one sheet of an .xlsx/.xls workbook into a pandas DataFrame."
tags = ["load", "read", "excel", "xlsx", "spreadsheet", "sheet"]
provides = ["df"]
code = '''
df = pd.read_excel(DATA_PATH, sheet_name={{ sheet }})
print(f"Loaded {len(df):,} rows x {df.shape[1]} columns from {DATA_PATH.name}")
'''

[params.sheet]
type = "scalar"
default = 0
description = "Sheet name or zero-based index"

[example]
dataset = "tiny_30"
file = "xlsx"
