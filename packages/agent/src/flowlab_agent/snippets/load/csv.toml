id = "load.csv"
title = "Load a CSV file"
description = "Read a delimited text file (CSV, TSV) into a pandas DataFrame."
tags = ["load", "read", "csv", "tsv", "file", "open"]
provides = ["df"]
code = '''
separator = {"comma": ",", "tab": "\t", "semicolon": ";", "pipe": "|"}[{{ sep }}]
df = pd.read_csv(DATA_PATH, sep=separator)
print(f"Loaded {len(df):,} rows x {df.shape[1]} columns from {DATA_PATH.name}")
'''

[params.sep]
type = "choice"
choices = ["comma", "tab", "semicolon", "pipe"]
default = "comma"
description = "Field separator"

[example]
dataset = "tiny_30"
