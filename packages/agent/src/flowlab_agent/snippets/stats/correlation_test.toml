id = "stats.correlation_test"
title = "Correlation test between two columns"
description = "Pearson, Spearman or Kendall correlation with p-value (and a 95% CI for Pearson)."
tags = ["correlation", "pearson", "spearman", "kendall", "relationship", "related", "association", "test", "significant"]
requires = ["df"]
imports = ["from scipy import stats"]
code = '''
column_a, column_b, corr_method = {{ column_a }}, {{ column_b }}, {{ method }}
pair = df[[column_a, column_b]].apply(pd.to_numeric, errors="coerce").dropna().astype(float)
tests = {"pearson": stats.pearsonr, "spearman": stats.spearmanr, "kendall": stats.kendalltau}
coefficient, corr_p = tests[corr_method](pair[column_a], pair[column_b])
print(f"{corr_method} r = {coefficient:.3f}, p = {corr_p:.4g}, n = {len(pair):,}")
if corr_method == "pearson" and len(pair) > 3:
    z, se = np.arctanh(coefficient), 1 / np.sqrt(len(pair) - 3)
    print(f"95% CI: [{np.tanh(z - 1.96 * se):.3f}, {np.tanh(z + 1.96 * se):.3f}]")
'''

[params.column_a]
type = "column"

[params.column_b]
type = "column"

[params.method]
type = "choice"
choices = ["pearson", "spearman", "kendall"]
default = "spearman"

[example]
with = { column_a = "tenure_months", column_b = "support_calls", method = "pearson" }
