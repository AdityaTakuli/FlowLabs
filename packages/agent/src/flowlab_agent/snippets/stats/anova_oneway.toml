id = "stats.anova_oneway"
title = "One-way ANOVA across groups"
description = "Compare a numeric column across 3+ groups with Levene check, eta-squared and a Kruskal-Wallis alternative."
tags = ["anova", "kruskal", "test", "compare", "difference", "groups", "means", "significant", "hypothesis"]
requires = ["df"]
imports = ["from scipy import stats"]
code = '''
value_column, group_column = {{ value_column }}, {{ group_column }}
test_data = df[[value_column, group_column]].dropna()
samples = {
    str(name): pd.to_numeric(group[value_column], errors="coerce").dropna()
    for name, group in test_data.groupby(group_column)
}
samples = {name: values for name, values in samples.items() if len(values) >= 2}
if len(samples) < 2:
    print("Need at least two groups with two or more values.")
else:
    groups = list(samples.values())
    anova = stats.f_oneway(*groups)
    kruskal = stats.kruskal(*groups)
    levene_p = stats.levene(*groups).pvalue
    pooled = pd.concat(groups)
    ss_between = sum(len(g) * (g.mean() - pooled.mean()) ** 2 for g in groups)
    ss_total = ((pooled - pooled.mean()) ** 2).sum()
    print(pd.DataFrame({name: {"n": len(v), "mean": v.mean(), "median": v.median()} for name, v in samples.items()}).T.round(3).to_string())
    print(f"ANOVA F = {anova.statistic:.3f}, p = {anova.pvalue:.4g}, eta-squared = {ss_between / ss_total if ss_total else float('nan'):.3f}")
    print(f"Kruskal-Wallis H = {kruskal.statistic:.3f}, p = {kruskal.pvalue:.4g}")
    if levene_p < 0.05:
        print(f"Assumption check: variances differ (Levene p = {levene_p:.4g}); rely on the Kruskal-Wallis result.")
'''

[params.value_column]
type = "column"

[params.group_column]
type = "column"

[example]
with = { value_column = "monthly_charges", group_column = "plan_type" }
