id = "stats.mann_whitney"
title = "Mann-Whitney U test"
description = "Non-parametric comparison of a numeric column between two groups, with rank-biserial effect size."
tags = ["mannwhitney", "wilcoxon", "nonparametric", "test", "compare", "difference", "groups", "median", "significant"]
requires = ["df"]
imports = ["from scipy import stats"]
code = '''
value_column, group_column = {{ value_column }}, {{ group_column }}
test_data = df[[value_column, group_column]].dropna()
group_labels = test_data[group_column].value_counts().index[:2]
group_a = pd.to_numeric(test_data.loc[test_data[group_column] == group_labels[0], value_column], errors="coerce").dropna()
group_b = pd.to_numeric(test_data.loc[test_data[group_column] == group_labels[1], value_column], errors="coerce").dropna()
mwu = stats.mannwhitneyu(group_a, group_b, alternative="two-sided")
rank_biserial = 1 - 2 * mwu.statistic / (len(group_a) * len(group_b))
print(f"{value_column}: {group_labels[0]} median {group_a.median():.3f} (n={len(group_a)}) vs {group_labels[1]} median {group_b.median():.3f} (n={len(group_b)})")
print(f"U = {mwu.statistic:.1f}, p = {mwu.pvalue:.4g}, rank-biserial r = {rank_biserial:.3f}")
'''

[params.value_column]
type = "column"

[params.group_column]
type = "column"

[example]
with = { value_column = "monthly_charges", group_column = "churned" }
