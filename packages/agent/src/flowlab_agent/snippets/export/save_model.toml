id = "export.save_model"
title = "Save the trained model"
description = "Persist the fitted model with joblib so it can be loaded and reused later."
tags = ["save", "export", "model", "joblib", "pickle", "persist", "deploy", "download"]
requires = ["model"]
imports = ["import joblib"]
code = '''
model_path = OUTPUT_DIR / {{ filename }}
joblib.dump(model, model_path)
print(f"Saved model to {model_path}")
'''

[params.filename]
type = "path"
default = "model.joblib"

[example]
target = "churned"
