id = "prep.select_k_best"
title = "Select the k best features"
description = "Keep the k features with the strongest univariate relationship to the target on train."
tags = ["feature", "select", "selection", "reduce", "best", "dimensionality"]
requires = ["features_ready"]
provides = ["features_ready"]
stage = 3.6
imports = ["from sklearn.feature_selection import SelectKBest, f_classif, f_regression"]
code = '''
score_function = f_classif if TASK == "classification" else f_regression
selector = SelectKBest(score_func=score_function, k=min({{ k }}, X_train.shape[1])).fit(X_train, y_train)
selected_features = X_train.columns[selector.get_support()]
X_train, X_test = X_train[selected_features], X_test[selected_features]
print("Selected features:", list(selected_features))
'''

[params.k]
type = "int"
default = 10
min = 1
max = 1000

[example]
target = "churned"
with = { k = 5 }
