id = "prep.variance_threshold"
title = "Drop low-variance features"
description = "Remove model-ready features whose train variance is below a threshold (near-constant columns)."
tags = ["variance", "threshold", "constant", "feature", "selection", "drop"]
requires = ["split", "features_ready"]
provides = ["split", "features_ready"]
stage = 3.6
imports = [
    "from sklearn.feature_selection import VarianceThreshold",
]
code = '''
variance_filter = VarianceThreshold(threshold={{ threshold }}).fit(X_train)
kept_features = X_train.columns[variance_filter.get_support()]
dropped_low_variance = [c for c in X_train.columns if c not in set(kept_features)]
X_train, X_test = X_train[kept_features], X_test[kept_features]
print(f"Dropped {len(dropped_low_variance)} low-variance features; {len(kept_features)} remain")
'''

[params.threshold]
type = "float"
default = 0.0
min = 0.0
max = 1000.0

[example]
target = "churned"
