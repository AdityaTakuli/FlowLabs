id = "prep.impute_numeric"
title = "Impute numeric columns"
description = "Fill missing numbers with the train mean or median, applied to both train and test."
tags = ["impute", "missing", "null", "nan", "fill", "median", "mean", "numeric"]
requires = ["split"]
provides = ["split"]
imports = ["from sklearn.impute import SimpleImputer"]
code = '''
impute_columns = {{ columns }} or [
    c for c in X_train.columns
    if pd.api.types.is_numeric_dtype(X_train[c]) and not pd.api.types.is_bool_dtype(X_train[c])
]
impute_strategy = {{ strategy }}
if impute_columns:
    numeric_imputer = SimpleImputer(strategy=impute_strategy, keep_empty_features=True)
    X_train[impute_columns] = numeric_imputer.fit_transform(X_train[impute_columns])
    X_test[impute_columns] = numeric_imputer.transform(X_test[impute_columns])
print(f"Imputed {len(impute_columns)} numeric columns with the train {impute_strategy}")
'''

[params.strategy]
type = "choice"
choices = ["median", "mean"]
default = "median"

[params.columns]
type = "columns"
optional = true

[example]
target = "churned"
