id = "prep.target_encode"
title = "Target encode categories"
description = "Replace categories with a cross-fitted mean of the target, learned on train only (no leakage)."
tags = ["encode", "target", "mean", "categorical", "category", "high", "cardinality"]
requires = ["split"]
provides = ["split"]
imports = [
    "from sklearn.preprocessing import TargetEncoder",
]
code = '''
target_columns = {{ columns }} or [
    c for c in X_train.columns
    if not (pd.api.types.is_numeric_dtype(X_train[c]) or pd.api.types.is_datetime64_any_dtype(X_train[c]))
]
if target_columns:
    target_type = "continuous" if TASK == "regression" else "auto"
    target_encoder = TargetEncoder(target_type=target_type, random_state=SEED)
    train_codes = target_encoder.fit_transform(X_train[target_columns].astype("string").fillna("missing"), y_train)
    test_codes = target_encoder.transform(X_test[target_columns].astype("string").fillna("missing"))
    code_names = [f"{c}_target_enc" for c in target_encoder.get_feature_names_out()]
    X_train = pd.concat([X_train.drop(columns=target_columns), pd.DataFrame(train_codes, columns=code_names, index=X_train.index)], axis=1)
    X_test = pd.concat([X_test.drop(columns=target_columns), pd.DataFrame(test_codes, columns=code_names, index=X_test.index)], axis=1)
print(f"Target encoded {len(target_columns)} columns")
'''

[params.columns]
type = "columns"
optional = true

[example]
target = "churned"
with = { columns = ["plan_type", "contract"] }
