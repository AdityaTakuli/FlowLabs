id = "prep.quantile_transform"
title = "Quantile transform"
description = "Map numeric features to a uniform or normal distribution by rank; robust to outliers."
tags = ["quantile", "rank", "transform", "uniform", "normal", "outliers", "numeric"]
requires = ["split"]
provides = ["split"]
imports = [
    "from sklearn.preprocessing import QuantileTransformer",
]
code = '''
quantile_columns = {{ columns }} or [
    c for c in X_train.columns
    if pd.api.types.is_numeric_dtype(X_train[c]) and not pd.api.types.is_bool_dtype(X_train[c])
]
if quantile_columns:
    quantiles = QuantileTransformer(
        n_quantiles=min({{ n_quantiles }}, len(X_train)), output_distribution={{ distribution }}, random_state=SEED
    )
    X_train[quantile_columns] = quantiles.fit_transform(X_train[quantile_columns].astype(float))
    X_test[quantile_columns] = quantiles.transform(X_test[quantile_columns].astype(float))
print(f"Quantile transformed {len(quantile_columns)} columns")
'''

[params.columns]
type = "columns"
optional = true

[params.distribution]
type = "choice"
choices = ["normal", "uniform"]
default = "normal"

[params.n_quantiles]
type = "int"
default = 1000
min = 10
max = 10000

[example]
target = "churned"
