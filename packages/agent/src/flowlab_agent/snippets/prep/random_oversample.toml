id = "prep.random_oversample"
title = "Balance classes by oversampling"
description = "Duplicate minority-class train rows until classes are balanced. Test rows are never touched."
tags = ["imbalance", "imbalanced", "oversample", "balance", "minority", "resample", "classification"]
task = "classification"
requires = ["split"]
provides = ["split"]
stage = 3.8
code = '''
class_counts = y_train.value_counts()
largest_class = int(class_counts.max() * {{ ratio }})
train_frame = X_train.assign(_label=y_train.values)
parts = []
for label, count in class_counts.items():
    rows = train_frame[train_frame["_label"] == label]
    extra = max(0, largest_class - count)
    parts.append(pd.concat([rows, rows.sample(extra, replace=True, random_state=SEED)]) if extra else rows)
balanced = pd.concat(parts).sample(frac=1.0, random_state=SEED)
X_train, y_train = balanced.drop(columns=["_label"]), balanced["_label"]
print(f"Oversampled train set: {y_train.value_counts().to_dict()}")
'''

[params.ratio]
type = "float"
default = 1.0
min = 0.1
max = 1.0
description = "Minority size as a share of the largest class"

[example]
dataset = "imbalanced_2pct"
target = "is_fraud"
