id = "prep.onehot_encode"
title = "One-hot encode categories"
description = "One 0/1 column per category, learned from train; unseen test categories become all zeros."
tags = ["encode", "onehot", "dummy", "categorical", "category", "convert"]
requires = ["split"]
provides = ["split"]
imports = ["from sklearn.preprocessing import OneHotEncoder"]
code = '''
onehot_columns = {{ columns }} or [
    c for c in X_train.columns
    if not (
        pd.api.types.is_numeric_dtype(X_train[c])
        or pd.api.types.is_bool_dtype(X_train[c])
        or pd.api.types.is_datetime64_any_dtype(X_train[c])
    )
]
onehot_columns = [c for c in onehot_columns if X_train[c].nunique() <= {{ max_categories }}]
if onehot_columns:
    encoder = OneHotEncoder(handle_unknown="ignore", sparse_output=False)
    encoder.fit(X_train[onehot_columns].astype("string").fillna("missing"))
    encoded_names = encoder.get_feature_names_out(onehot_columns)

    def _onehot(frame):
        encoded = encoder.transform(frame[onehot_columns].astype("string").fillna("missing"))
        encoded = pd.DataFrame(encoded, columns=encoded_names, index=frame.index)
        return pd.concat([frame.drop(columns=onehot_columns), encoded], axis=1)

    X_train, X_test = _onehot(X_train), _onehot(X_test)
print(f"One-hot encoded {len(onehot_columns)} columns; {X_train.shape[1]} features now")
'''

[params.columns]
type = "columns"
optional = true

[params.max_categories]
type = "int"
default = 30
min = 2
max = 500
description = "Skip columns with more categories than this"

[example]
target = "churned"
with = { columns = ["plan_type", "contract"] }
