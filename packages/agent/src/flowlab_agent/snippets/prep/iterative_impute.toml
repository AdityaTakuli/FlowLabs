id = "prep.iterative_impute"
title = "Iterative (MICE) imputation"
description = "Model each numeric column with missing values from the others, round-robin, fitted on train."
tags = ["impute", "iterative", "mice", "regression", "missing", "fill", "numeric"]
requires = ["split"]
provides = ["split"]
imports = [
    "from sklearn.experimental import enable_iterative_imputer",
    "from sklearn.impute import IterativeImputer",
]
code = '''
iterative_columns = {{ columns }} or [
    c for c in X_train.columns
    if pd.api.types.is_numeric_dtype(X_train[c]) and not pd.api.types.is_bool_dtype(X_train[c])
]
if iterative_columns:
    iterative_imputer = IterativeImputer(max_iter={{ max_iter }}, random_state=SEED, keep_empty_features=True)
    X_train[iterative_columns] = iterative_imputer.fit_transform(X_train[iterative_columns].astype(float))
    X_test[iterative_columns] = iterative_imputer.transform(X_test[iterative_columns].astype(float))
print(f"Iteratively imputed {len(iterative_columns)} numeric columns")
'''

[params.columns]
type = "columns"
optional = true

[params.max_iter]
type = "int"
default = 10
min = 1
max = 100

[example]
dataset = "missing_20pct"
target = "target"
