id = "prep.remove_outliers"
title = "Remove outlier rows (z-score)"
description = "Drop training rows where any selected feature is beyond a z-score threshold. Test rows are kept."
tags = ["outlier", "remove", "zscore", "anomaly", "extreme", "drop"]
requires = ["split"]
provides = ["split"]
code = '''
zscore_columns = {{ columns }} or [
    c for c in X_train.columns
    if pd.api.types.is_numeric_dtype(X_train[c]) and not pd.api.types.is_bool_dtype(X_train[c])
]
z_limit = {{ threshold }}
if zscore_columns:
    values = X_train[zscore_columns].astype(float)
    z_scores = ((values - values.mean()) / values.std(ddof=0).replace(0, np.nan)).abs()
    keep_rows = ~(z_scores > z_limit).any(axis=1)
    print(f"Removed {int((~keep_rows).sum())} training rows with |z| > {z_limit}")
    X_train, y_train = X_train.loc[keep_rows], y_train.loc[keep_rows]
'''

[params.columns]
type = "columns"
optional = true

[params.threshold]
type = "float"
default = 3.0
min = 1.0
max = 10.0

[example]
target = "churned"
