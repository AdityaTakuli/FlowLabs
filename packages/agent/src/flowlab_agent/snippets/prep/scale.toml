id = "prep.scale"
title = "Scale numeric features"
description = "Standardise, min-max or robust-scale numeric features using train statistics only."
tags = ["scale", "standardize", "normalize", "minmax", "robust", "numeric", "features"]
requires = ["split"]
provides = ["split"]
imports = ["from sklearn.preprocessing import MinMaxScaler, RobustScaler, StandardScaler"]
code = '''
scale_columns = {{ columns }} or [
    c for c in X_train.columns
    if pd.api.types.is_numeric_dtype(X_train[c])
    and not pd.api.types.is_bool_dtype(X_train[c])
    and X_train[c].nunique() > 2
]
scaler = {"standard": StandardScaler(), "minmax": MinMaxScaler(), "robust": RobustScaler()}[{{ method }}]
if scale_columns:
    X_train[scale_columns] = scaler.fit_transform(X_train[scale_columns])
    X_test[scale_columns] = scaler.transform(X_test[scale_columns])
print(f"Scaled {len(scale_columns)} columns")
'''

[params.method]
type = "choice"
choices = ["standard", "minmax", "robust"]
default = "standard"

[params.columns]
type = "columns"
optional = true

[example]
target = "churned"
with = { method = "robust" }
