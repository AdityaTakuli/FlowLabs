id = "prep.pca"
title = "PCA (dimensionality reduction)"
description = "Project model-ready features onto principal components that keep a share of the variance."
tags = ["pca", "principal", "components", "dimensionality", "reduction", "compress", "decorrelate"]
requires = ["split", "features_ready"]
provides = ["split", "features_ready"]
stage = 3.7
imports = [
    "from sklearn.decomposition import PCA",
]
code = '''
pca = PCA(n_components={{ variance }}, random_state=SEED)
pca_train = pca.fit_transform(X_train)
pca_names = [f"pc{i + 1}" for i in range(pca_train.shape[1])]
X_train = pd.DataFrame(pca_train, columns=pca_names, index=X_train.index)
X_test = pd.DataFrame(pca.transform(X_test), columns=pca_names, index=X_test.index)
print(f"PCA kept {len(pca_names)} components explaining {pca.explained_variance_ratio_.sum():.1%} of variance")
'''

[params.variance]
type = "float"
default = 0.95
min = 0.5
max = 0.999
description = "Share of variance to keep"

[example]
dataset = "clean_numeric"
target = "y"
