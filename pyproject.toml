[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlab"
version = "0.1.0"
description = "FlowLab Phase 0: Flow Spec contracts, node catalogue, compiler and local executor"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "polars>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "joblib>=1.3",
    "click>=8.1",
    "jupyter_client>=8.0",
    "ipykernel>=6.0",
    "nbformat>=5.9",
    "libcst>=1.1",
    "psutil>=5.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "tree-sitter-language-pack>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
flowlab = "flowlab_engine.cli:main"

[tool.setuptools.packages.find]
where = ["packages/flowspec/src", "packages/nodes/src", "packages/engine/src", "packages/agent/src", "packages/lab/src", "apps/api/src"]

[tool.setuptools.package-data]
flowlab_agent = ["snippets/*/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"packages/agent/src/flowlab_agent/planner.py" = ["E501"]  # prompt text: line breaks are meaningful
"packages/lab/src/flowlab_lab/kernel_helpers.py" = ["E501"]  # Python source embedded as a string
"packages/lab/src/flowlab_lab/eject.py" = ["E501"]  # code generator: templates mirror the emitted lines

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "apps/api/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "scipy.*", "pandas.*", "psutil.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["flowlab_lab.eject"]  # nbformat's v4 builders are untyped
disallow_untyped_calls = false
