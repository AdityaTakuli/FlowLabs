[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlabs"
version = "0.2.0"
description = "Visual machine learning: load data, preprocess, train ML and deep learning models, export them. No code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Aditya Takuli" }]
keywords = ["machine learning", "deep learning", "no-code", "automl", "scikit-learn", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "joblib>=1.3",
    "pillow>=10",
    "openpyxl>=3.1",
    "pyarrow>=15",
    "psutil>=5.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "torchvision>=0.17", "onnx>=1.15"]
boost = ["xgboost>=2.0", "lightgbm>=4.0"]
desktop = ["pywebview>=5.0"]
all = ["flowlabs[deep,boost,desktop]"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]
build = ["pyinstaller>=6.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/AdityaTakuli/FlowLabs"
App = "https://adityatakuli.github.io/FlowLabs/"

[project.scripts]
flowlabs = "flowlabs.cli:main"
flowlabs-app = "flowlabs.cli:app_main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["flowlabs_runtime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowlabs = ["core/samples/*.csv", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "E731", "SIM102", "SIM105", "SIM108", "B023"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/flowlabs/core/catalogue.py" = ["E501"]
"src/flowlabs/core/export.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
